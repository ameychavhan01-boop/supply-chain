<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Supply Chain">
<meta name="theme-color" content="#0B1020">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>Supply Chain</title>
<style>:root{
  --bg:#0B1020; --panel:rgba(22,28,48,.86); --panel-solid:#161C30; --panel2:#1E2640; --line:rgba(255,255,255,.10);
  --text:#F2F4FA; --muted:#9AA3BC; --accent:#F5B83D; --accent-ink:#1A1206;
  --win:#22C55E; --lose:#EF4444; --warn:#F59E0B; --weak:#FF3B5C;
  --radius:16px; --shadow:0 10px 40px rgba(0,0,0,.35);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Arial,sans-serif;
}
html.light{ --panel:rgba(255,255,255,.88); --panel-solid:#FFFFFF; --panel2:#EEF1F7; --line:rgba(15,23,42,.10); --text:#0F172A; --muted:#5B6478; --shadow:0 10px 30px rgba(15,23,42,.12); }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:16px;color:var(--text)}
.hide{display:none!important}

/* ---------- Top bar ---------- */
#top{position:fixed;top:0;left:0;right:0;height:64px;padding:calc(env(safe-area-inset-top) + 10px) 20px 0;display:flex;align-items:center;justify-content:center;z-index:40;pointer-events:none}
#logo{pointer-events:auto;display:flex;align-items:center;justify-content:center;height:34px;padding:0 22px;border-radius:999px;background:#0A0A0A;border:1px solid rgba(255,255,255,.16);color:#fff;font-weight:600;letter-spacing:.28em;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.35);white-space:nowrap}
#logo b{font-weight:800;letter-spacing:.3em;margin-right:.55em}
#searchWrap{pointer-events:auto;position:absolute;right:20px;top:calc(env(safe-area-inset-top) + 10px);width:330px}
#search{width:100%;height:40px;border-radius:999px;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding:0 16px 0 40px;outline:none}
#searchWrap svg{position:absolute;left:14px;top:11px;width:18px;height:18px;opacity:.6}
#results{position:absolute;top:46px;left:0;right:0;max-height:60vh;overflow:auto;background:var(--panel-solid);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px}
#results .r{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer}
#results .r:hover,#results .r.on{background:var(--panel2)}
#results .r small{color:var(--muted);margin-left:auto;font-size:12px}
#leftTop{pointer-events:auto;position:absolute;left:20px;top:calc(env(safe-area-inset-top) + 10px);display:flex;gap:8px}

/* ---------- Screens ---------- */
.screen{position:fixed;inset:0;padding-top:calc(env(safe-area-inset-top) + 64px);padding-bottom:calc(env(safe-area-inset-bottom) + 76px);overflow:hidden}
.scroll{height:100%;overflow:auto;-webkit-overflow-scrolling:touch;padding:12px 28px 40px}
h1{font-size:28px;font-weight:700;margin:6px 0 4px;letter-spacing:-.01em}
h2{font-size:20px;font-weight:650;margin:22px 0 10px}
h3{font-size:16px;font-weight:650;margin:16px 0 8px}
.muted{color:var(--muted)}
.small{font-size:13px}

/* ---------- Tab bar ---------- */
#tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 12px);display:flex;gap:6px;padding:6px;border-radius:22px;background:var(--panel);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid var(--line);box-shadow:var(--shadow);z-index:45}
#tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:96px;padding:8px 14px;border-radius:16px;color:var(--muted);font-size:12px;font-weight:600;transition:.2s}
#tabs button svg{width:22px;height:22px}
#tabs button.on{background:var(--accent);color:var(--accent-ink)}

/* ---------- Generic UI ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-weight:600;font-size:14px;white-space:nowrap;transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn svg{width:18px;height:18px}
.btn.acc{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.red{background:var(--lose);color:#fff;border-color:transparent}
.btn.on{outline:2px solid var(--accent)}
.btn.ghost{background:var(--panel);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.iconbtn{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--panel2);border:1px solid var(--line)}
.iconbtn svg{width:20px;height:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:650;background:var(--panel2);border:1px solid var(--line)}
.pill.g{background:rgba(34,197,94,.16);color:#22C55E;border-color:transparent}
.pill.r{background:rgba(239,68,68,.16);color:#F87171;border-color:transparent}
.pill.a{background:rgba(245,184,61,.18);color:var(--accent);border-color:transparent}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px}
.seg button{padding:8px 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.sep{height:1px;background:var(--line);margin:14px 0}

/* ---------- World ---------- */
#world{background:radial-gradient(ellipse at 50% 40%, color-mix(in srgb, var(--accent) 7%, var(--bg)) 0%, var(--bg) 70%)}
#worldSvg{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.land{fill:color-mix(in srgb, var(--text) 9%, transparent);stroke:color-mix(in srgb, var(--text) 14%, transparent);stroke-width:.4}
.ctry{stroke:rgba(255,255,255,.55);stroke-width:.5;cursor:pointer;transition:opacity .4s, filter .4s}
.ctry.tech{fill:#7C5CFF}.ctry.energy{fill:#F59E0B}.ctry.materials{fill:#14B8A6}.ctry.factory{fill:#EF6A3A}.ctry.mix{fill:#E9B43C}
.ctry{filter:drop-shadow(0 0 4px currentColor)}
.ctry.tech{color:#7C5CFF}.ctry.energy{color:#F59E0B}.ctry.materials{color:#14B8A6}.ctry.factory{color:#EF6A3A}.ctry.mix{color:#E9B43C}
@media (prefers-reduced-motion:no-preference){ .ctry{animation:glow 3.2s ease-in-out infinite} }
@keyframes glow{0%,100%{filter:drop-shadow(0 0 2px currentColor)}50%{filter:drop-shadow(0 0 7px currentColor)}}
.ctry.dim{opacity:.18;animation:none}
.ctry.sel{stroke:#fff;stroke-width:1.2}
.route{fill:none;stroke-width:1.3;stroke-dasharray:4 5;opacity:.85}
@media (prefers-reduced-motion:no-preference){ .route{animation:flow 1.4s linear infinite} }
@keyframes flow{to{stroke-dashoffset:-18}}
.spot{cursor:pointer}
.spot circle.c{fill:var(--accent)}
.spot circle.h{fill:var(--accent);opacity:.25}
.risk circle.c{fill:var(--weak)}
.risk circle.h{fill:var(--weak);opacity:.3}
@media (prefers-reduced-motion:no-preference){ .spot circle.h,.risk circle.h{animation:pulse 2s ease-out infinite;transform-box:fill-box;transform-origin:center} }
@keyframes pulse{0%{transform:scale(.6);opacity:.6}100%{transform:scale(2.4);opacity:0}}
.clabel{font-size:7px;font-weight:700;fill:var(--text);pointer-events:none;paint-order:stroke;stroke:var(--bg);stroke-width:2px}
.depArrow{fill:none;stroke:var(--accent);stroke-width:1.2;stroke-dasharray:300;stroke-dashoffset:300;animation:draw 1.2s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
#fact{position:absolute;left:24px;top:calc(env(safe-area-inset-top) + 78px);max-width:360px}
#fact .k{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.06em;text-transform:uppercase}
#fact p{margin:6px 0 0;line-height:1.45}
#legend{position:absolute;left:24px;bottom:calc(env(safe-area-inset-bottom) + 92px);font-size:13px}
#legend .i{display:flex;align-items:center;gap:8px;margin:4px 0}
#legend .d{width:12px;height:12px;border-radius:4px}
#worldTools{position:absolute;right:24px;bottom:calc(env(safe-area-inset-bottom) + 92px);display:flex;flex-direction:column;gap:8px;align-items:flex-end}
#riskHint{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 80px);background:var(--weak);color:#fff;padding:8px 16px;border-radius:999px;font-weight:650;font-size:14px}

/* Side panel */
.side{position:fixed;top:calc(env(safe-area-inset-top) + 64px);right:0;bottom:calc(env(safe-area-inset-bottom) + 80px);width:420px;max-width:92vw;background:var(--panel-solid);border-left:1px solid var(--line);border-radius:22px 0 0 22px;box-shadow:var(--shadow);z-index:30;transform:translateX(105%);transition:transform .45s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.side.open{transform:none}
.side .hd{padding:18px 18px 10px;display:flex;align-items:flex-start;gap:12px;border-bottom:1px solid var(--line)}
.side .hd .t{flex:1}
.side .hd h2{margin:0;font-size:22px}
.side .bd{overflow:auto;padding:6px 18px 24px;-webkit-overflow-scrolling:touch}
.side ul{margin:6px 0;padding-left:18px;line-height:1.55}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:14px;margin:8px 0}
.kv .k{color:var(--muted)}
.cobtn{display:inline-flex;align-items:center;gap:6px;margin:4px 6px 0 0;padding:6px 10px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-size:13px;font-weight:600}

/* ---------- Chains list ---------- */
.chainGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.chainCard{position:relative;padding:18px;border-radius:20px;border:1px solid var(--line);background:var(--panel);min-height:130px;display:flex;flex-direction:column;gap:8px;cursor:pointer;overflow:hidden;transition:transform .15s}
.chainCard:active{transform:scale(.98)}
.chainCard .ic{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent)}
.chainCard .ic svg{width:26px;height:26px}
.chainCard .nm{font-weight:700;font-size:17px}
.chainCard.lock{opacity:.55;cursor:default}
.chainCard .star{position:absolute;right:14px;top:14px}

/* ---------- Chain view ---------- */
#chainView{background:var(--bg)}
#chainBar{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 64px);padding:8px 20px;display:flex;align-items:center;gap:8px;z-index:12;flex-wrap:wrap}
#chainBar .title{font-weight:750;font-size:20px;margin-right:6px}
#canvasWrap{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 120px);bottom:0;overflow:hidden;touch-action:none}
#chainSvg{width:100%;height:100%;display:block}
.lvlLabel{font-size:15px;font-weight:750;fill:var(--muted);letter-spacing:.02em}
.lvlBand{fill:color-mix(in srgb,var(--text) 3%,transparent)}
.link{fill:none;stroke:color-mix(in srgb,var(--text) 16%,transparent);stroke-width:1.2}
.link.hl{stroke:var(--accent);stroke-width:2.4;opacity:1}
.link.hit{stroke:var(--lose);stroke-width:2.2}
.dim .link:not(.hl){opacity:.12}
.node{cursor:pointer}
.node .box{fill:var(--panel-solid);stroke:var(--line);stroke-width:1}
.node .stripe{rx:3}
.node .nm{font-size:14px;font-weight:700;fill:var(--text)}
.node .sub{font-size:11.5px;fill:var(--muted);font-weight:600}
.node .bar0{fill:color-mix(in srgb,var(--text) 10%,transparent)}
.node .bar1{fill:var(--accent)}
.node .badge{font-size:10px;font-weight:800;letter-spacing:.04em}
.node.weakN .box{stroke:var(--weak);stroke-width:2.2}
.node.weakN .wring{fill:none;stroke:var(--weak);stroke-width:2;opacity:.6}
@media (prefers-reduced-motion:no-preference){ .node.weakN .wring{animation:wpulse 2.2s ease-in-out infinite} }
@keyframes wpulse{0%,100%{opacity:.15}50%{opacity:.85}}
.dim .node:not(.hl){opacity:.22}
.node.sel .box{stroke:var(--accent);stroke-width:2.6}
.node .fall{transform-box:fill-box;transform-origin:50% 100%;transition:transform .55s cubic-bezier(.5,-0.3,.7,1.4), opacity .4s}
.node.down .fall{transform:rotate(-78deg) translateY(10px)}
.node.down .box{fill:color-mix(in srgb,var(--lose) 28%,var(--panel-solid));stroke:var(--lose)}
.node.shake .fall{animation:shake .5s ease 2}
.node.shake .box{fill:color-mix(in srgb,var(--warn) 22%,var(--panel-solid));stroke:var(--warn)}
.node.gain .box{fill:color-mix(in srgb,var(--win) 22%,var(--panel-solid));stroke:var(--win);stroke-width:2.4}
.node.src .box{fill:var(--lose);stroke:#fff}
.node.src .nm{fill:#fff}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.hubTxt{font-size:22px;font-weight:800;fill:var(--text)}
#mini{position:absolute;right:18px;bottom:calc(env(safe-area-inset-bottom) + 92px);width:220px;height:150px;border-radius:14px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);overflow:hidden;z-index:11}
#mini svg{width:100%;height:100%}
#mini .vp{fill:color-mix(in srgb,var(--accent) 18%,transparent);stroke:var(--accent);stroke-width:2}
#roleLegend{position:absolute;left:18px;bottom:calc(env(safe-area-inset-bottom) + 92px);z-index:11;padding:10px 12px;font-size:12px;display:grid;grid-template-columns:auto auto;gap:4px 14px}
#roleLegend .i{display:flex;align-items:center;gap:6px}
#roleLegend .d{width:10px;height:10px;border-radius:3px}
#zoomBtns{position:absolute;right:250px;bottom:calc(env(safe-area-inset-bottom) + 92px);display:flex;flex-direction:column;gap:8px;z-index:11}
#wiBanner{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 126px);z-index:13;background:var(--lose);color:#fff;padding:8px 16px;border-radius:999px;font-weight:650;font-size:14px;display:flex;gap:10px;align-items:center}

/* ---------- Sheets / modals ---------- */
#veil{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;opacity:0;pointer-events:none;transition:opacity .25s}
#veil.on{opacity:1;pointer-events:auto}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%) scale(.98);opacity:0;pointer-events:none;z-index:61;width:min(720px,92vw);max-height:84vh;display:flex;flex-direction:column;background:var(--panel-solid);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);transition:.28s cubic-bezier(.2,.8,.2,1)}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.modal .hd{padding:18px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.modal .hd h2{margin:0;flex:1;font-size:21px}
.modal .bd{padding:16px 20px 22px;overflow:auto}
.modal.wide{width:min(1100px,94vw)}
pre.kp{white-space:pre-wrap;background:var(--panel2);border-radius:14px;padding:16px;font-family:var(--font);font-size:15px;line-height:1.6;margin:0}
.tl{position:relative;margin-left:12px;border-left:2px solid var(--line);padding-left:22px}
.tl .ev{position:relative;margin:0 0 22px}
.tl .ev:before{content:"";position:absolute;left:-30px;top:4px;width:14px;height:14px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 25%,transparent)}
.tl .dt{font-size:12px;font-weight:800;color:var(--accent);letter-spacing:.06em;text-transform:uppercase}
.tl .tt{font-weight:700;font-size:17px;margin:2px 0 4px}
.tl p{margin:0 0 6px;line-height:1.5;color:var(--muted)}
.mv{display:inline-flex;gap:6px;align-items:center;margin:4px 6px 0 0;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:700}
.mv.dn{background:rgba(239,68,68,.15);color:#F87171}
.mv.up{background:rgba(34,197,94,.15);color:#22C55E}
.sumGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.sumGrid .col{background:var(--panel2);border-radius:16px;padding:14px}
.sumGrid .col h3{margin:0 0 8px}
.sumGrid .it{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.sumGrid .it:last-child{border:0}
.sumGrid .it b{display:block}
.sumGrid .it span{color:var(--muted);font-size:13px}
.sev{display:flex;gap:10px;margin:10px 0}
.sev button{flex:1;padding:16px;border-radius:16px;background:var(--panel2);border:2px solid var(--line);font-weight:700;text-align:left}
.sev button small{display:block;font-weight:500;color:var(--muted);margin-top:4px}
.sev button.on{border-color:var(--lose)}
.cmp{display:grid;grid-template-columns:160px 1fr 1fr;gap:0;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.cmp>div{padding:10px 12px;border-bottom:1px solid var(--line);font-size:14px}
.cmp .h{font-weight:750;background:var(--panel2)}
.cmp .k{color:var(--muted);background:var(--panel2)}
select,.inp,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:none}
textarea{width:100%;min-height:80px;resize:vertical}
.note{background:var(--panel2);border-radius:12px;padding:10px 12px;margin:8px 0}
.note .meta{font-size:12px;color:var(--muted);margin-bottom:4px;display:flex;gap:8px;align-items:center}
.note .meta button{margin-left:auto;color:var(--muted);font-size:12px}
.srcLink{color:var(--accent);font-weight:650;text-decoration:none;font-size:13px}
.ap{font-size:11px;font-weight:800;color:var(--warn);background:rgba(245,158,11,.14);padding:2px 6px;border-radius:6px;margin-left:6px}
.tapnum{border-bottom:1px dashed var(--muted);cursor:pointer}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translateX(-50%) translateY(20px);opacity:0;background:var(--text);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:650;z-index:80;transition:.25s;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%)}
#banner{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 70px);z-index:50;max-width:720px;width:92vw}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.sw{border-radius:16px;padding:12px;border:2px solid var(--line);cursor:pointer;text-align:left}
.sw.on{border-color:var(--accent)}
.sw .pv{height:54px;border-radius:10px;margin-bottom:8px;display:flex;align-items:flex-end;padding:6px}
.sw .pv i{width:28px;height:10px;border-radius:999px;display:block}
.setRow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.setRow:last-child{border:0}
.toggle{width:52px;height:32px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);position:relative;transition:.2s}
.toggle:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.toggle.on{background:var(--win)}
.toggle.on:after{left:23px}
.folderBar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}
.savedItem{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);margin-bottom:8px;cursor:pointer}
.savedItem .grow{flex:1}
.empty{padding:40px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div id="top">
  <div id="leftTop"></div>
  <div id="logo"><b>JSR</b>ENTERPRISES</div>
  <div id="searchWrap"><input id="search" type="search" autocomplete="off" placeholder="Search company, product, country"><div id="results" class="hide"></div></div>
</div>

<section id="world" class="screen">
  <svg id="worldSvg" preserveAspectRatio="xMidYMid meet"></svg>
  <div id="fact" class="card"></div>
  <div id="legend" class="card"></div>
  <div id="worldTools"></div>
  <div id="riskHint" class="hide">Tap the map to mark a risk spot</div>
</section>

<section id="chains" class="screen hide"><div class="scroll" id="chainsList"></div></section>

<section id="chainView" class="screen hide">
  <div id="chainBar"></div>

    history: [
      { date: "Sep 1999", title: "Taiwan Chi-Chi earthquake", what: "A big earthquake cut power to Taiwan's chip parks. Memory chip prices jumped worldwide. First big lesson that Taiwan is a single point of failure.", moves: [] },
      { date: "Mar 2011", title: "Japan earthquake & tsunami", what: "Renesas (then over 40% of car microcontrollers) lost its Naka plant for about 3 months. Japan made over 60% of silicon wafers then. Car factories around the world slowed.", moves: [], src: "WardsAuto / eWeek", url: "https://wardsauto.com/industry-news/march-11-2011-day-world-stopped-japanese-auto-industry" },
      { date: "Oct 2011", title: "Thailand floods — hard-drive shortage", what: "Thailand made 40–45% of hard drives. Western Digital (60% of its capacity in Thailand) stopped production. PC makers cut output.", moves: [{ n: "Western Digital", p: -15, t: "in about a week" }], src: "AP via Washington Times", url: "https://m.washingtontimes.com/news/2011/oct/19/thailand-flooding-smacks-hard-drive-industry/" },
      { date: "Jul 2019", title: "Japan limits chemical exports to Korea", what: "Japan restricted photoresist, hydrogen fluoride and fluorinated polyimide to South Korea. Korea got about 92% of its photoresist from Japan. Korea rushed to build local suppliers.", moves: [], src: "DHL / IHS Markit", url: "https://lot.dhl.com/japan-south-korea-trade-row-triggers-rethink-of-supply-chains/" },
      { date: "2020–2022", title: "Global chip shortage", what: "Covid demand for laptops and phones took chip capacity away from cars. Maruti's Sept 2021 production fell 52% vs Sept 2020; it lost about 1,16,000 cars in Jul–Sep 2021 and profit fell 65%.", moves: [{ n: "Maruti Suzuki", p: -1, t: "on 1 Sep 2021 (production-cut warning)" }], src: "Autocar Pro", url: "https://www.autocarpro.in/news-national/chip-woes-cost-maruti-suzuki-116-000-units-in-q2-profit-down-65-80326" },
      { date: "Mar 2021", title: "Renesas Naka factory fire", what: "A fire stopped a key car-chip line for about a month. Renesas had about 30% of car microcontrollers.", moves: [{ n: "Renesas", p: -4.9, t: "same day" }, { n: "Toyota / Honda / Nissan", p: -3.3, t: "each, at least, same day" }], src: "Reuters via Taipei Times", url: "https://www.taipeitimes.com/News/biz/archives/2021/03/23/2003754302" },
      { date: "Mar 2022", title: "Ukraine war — neon stops", what: "Ingas and Cryoin, which made 45–54% of chip-grade neon, shut down. Chipmakers used stockpiles; gas firms like Linde started their own neon purification.", moves: [], src: "Reuters via The Register", url: "https://www.theregister.com/2022/03/11/ukraine_neon_supplies/" },
      { date: "Oct 2022", title: "US blocks advanced chip tools to China", what: "US banned sales of advanced chip machines and AI chips to China. Equipment makers lost a big market overnight.", moves: [{ n: "TSMC", p: -8.3, t: "next trading day" }, { n: "Lam Research", p: -6.4, t: "first day" }, { n: "KLA", p: -11.4, t: "in one week" }, { n: "Lam Research", p: -13.6, t: "in one week" }], src: "Light Reading / Asia Economy", url: "https://www.lightreading.com/business-management/biden-s-new-export-controls-stun-china-s-chip-industry" },
      { date: "Jul 2023", title: "China controls gallium & germanium", what: "China (≈98% of gallium, ≈60% of germanium) started export licences from 1 Aug 2023, then banned sales to the US in Dec 2024. Prices jumped.", moves: [], src: "Takshashila", url: "https://takshashila.org.in/content/publications/China-Ga-Ge-Export-Restrictions-29032026.html" },
      { date: "27 Jan 2025", title: "DeepSeek AI shock", what: "A cheap Chinese AI model made investors fear less demand for AI chips. Biggest one-day value loss for any company in US history.", moves: [{ n: "Nvidia", p: -17, t: "in one day (~$589B lost)" }, { n: "Broadcom", p: -17.4, t: "in one day" }, { n: "ASML", p: -7, t: "in one day" }], src: "Bloomberg / Washington Times", url: "https://www.bloomberg.com/news/articles/2025-01-27/asml-sinks-as-china-ai-startup-triggers-panic-in-tech-stocks" },
      { date: "Oct 2025", title: "Nexperia crisis", what: "China blocked Nexperia China exports (4 Oct) and the Dutch govt took control (13 Oct). About 80% of Nexperia's finished capacity was in China. Bosch shut 3 European plants; Honda cut North America output; VW warned of cuts.", moves: [], src: "S&P Global / Digitimes", url: "https://www.spglobal.com/automotive-insights/en/blogs/2025/10/dutch-takeover-of-chinese-owned-nexperia" },
      { date: "Feb–Mar 2026", title: "India's first chip plants open", what: "Micron's Sanand plant opened 28 Feb 2026, Kaynes Semicon on 31 Mar 2026. CG Semi already producing. Tata's Dholera fab under construction.", moves: [], src: "India Briefing", url: "https://www.india-briefing.com/news/india-semiconductor-manufacturing-sanand-gujarat-2026-43814.html" },

    keyPoints: [
      "CHIPS SUPPLY CHAIN – Key points",
      "• Flow: Sand → Polysilicon → Wafers → Machines print circuits → Fab → Packaging → Chip brand → Phone/Server/Car",

      "• ASML (Netherlands) = only EUV machine maker (100%)",

  if (savedSeg === "chains") {
    var cs = ST.stars.chains.filter(function (id) { return D[id] && inF("chains", id); });
    h += cs.length ? cs.map(function (id) { return '<div class="savedItem" data-oc="' + id + '">' + icon("link", ' width="22" height="22"') + '<div class="grow"><b>' + esc(D[id].name) + '</b><div class="muted small">' + D[id].nodes.length + ' companies</div></div><button class="iconbtn" data-fold="chains:' + id + '">' + icon("folder") + "</button></div>"; }).join("") : '<div class="empty">No starred chains yet. Tap ☆ on a chain.</div>';
  } else if (savedSeg === "companies") {
    var ns = ST.stars.companies.filter(function (id) { return NODE[id] && inF("companies", id); });
    h += ns.length ? ns.map(function (id) { var n = NODE[id]; return '<div class="savedItem" data-on="' + id + '"><div style="font-size:26px">' + flag(n.c) + '</div><div class="grow"><b>' + esc(n.n) + '</b><div class="muted small">' + esc(ROLES[n.r].name) + (n.nse ? " · NSE " + esc(n.nse) : "") + '</div></div><button class="iconbtn" data-fold="companies:' + id + '">' + icon("folder") + "</button></div>"; }).join("") : '<div class="empty">No starred companies yet. Open a company and tap ☆.</div>';
  } else {
    h += '<input class="inp" id="nq" placeholder="Search my notes" style="width:100%;margin-bottom:12px" value="' + esc(noteQ) + '">';
    var list = ST.notes.filter(function (x) { var n = NODE[x.ref]; return !noteQ || (x.text + " " + (n ? n.n : "")).toLowerCase().indexOf(noteQ.toLowerCase()) >= 0; }).sort(function (a, b) { return b.ts - a.ts; });
    h += list.length ? list.map(function (x) { var n = NODE[x.ref]; return '<div class="savedItem" data-on="' + x.ref + '" style="align-items:flex-start">' + icon("note", ' width="22" height="22"') + '<div class="grow"><b>' + esc(n ? n.n : "Note") + '</b><div class="muted small">' + fmtTime(x.ts) + '</div><div style="margin-top:6px">' + esc(x.text).replace(/\n/g, "<br>") + "</div></div></div>"; }).join("") : '<div class="empty">No notes found.</div>';
  }
  var body = $("#savedBody"); body.innerHTML = h;
  $$("[data-s]", body).forEach(function (b) { b.onclick = function () { savedSeg = b.dataset.s; renderSaved(); }; });
  $$("[data-fd]", body).forEach(function (b) { b.onclick = function () { savedFolder = b.dataset.fd; renderSaved(); }; });
  var fn = $("#fdNew"); if (fn) fn.onclick = function () { openModal("New folder", '<input class="inp" id="fNm" placeholder="Folder name" style="width:100%"><div class="row" style="margin-top:12px"><button class="btn acc" id="fOk">Create</button></div>'); $("#fOk").onclick = function () { var nm = $("#fNm").value.trim(); if (!nm) return; ST.folders.push({ id: "f" + Date.now(), name: nm, items: [] }); save(); closeModal(); renderSaved(); }; };
  var fdl = $("#fdDel"); if (fdl) fdl.onclick = function () { ST.folders = ST.folders.filter(function (f) { return f.id !== savedFolder; }); savedFolder = "all"; save(); renderSaved(); toast("Folder deleted (items stay starred)"); };
  $$("[data-oc]", body).forEach(function (d) { d.onclick = function (e) { if (e.target.closest("[data-fold]")) return; openChain(d.dataset.oc); }; });
  $$("[data-on]", body).forEach(function (d) { d.onclick = function (e) { if (e.target.closest("[data-fold]")) return; openChain(NODE[d.dataset.on].chain, d.dataset.on); }; });
  $$("[data-fold]", body).forEach(function (b) { b.onclick = function () { var p = b.dataset.fold.split(":"); folderPicker(p[0], p[1]); }; });
  var nq = $("#nq"); if (nq) { nq.oninput = function () { noteQ = nq.value; var pos = nq.selectionStart; renderSaved(); var n2 = $("#nq"); n2.focus(); n2.setSelectionRange(pos, pos); }; }
}

/* ================= SETTINGS ================= */
var UPDATE_MSG = "Please update my Supply Chain app (GitHub repo: supply-chain). Refresh market caps, revenues and market shares with sources, add new history events, and keep my design the same. Current data version: " + window.SC_DATA_VERSION + ".";
function renderSettings() {
  var s = ST.set;
  var h = '<h1>Settings</h1><h2>Colour theme</h2><div class="swatches">' + Object.keys(THEMES).map(function (k) { var t = THEMES[k]; return '<button class="sw ' + (s.theme === k ? "on" : "") + '" data-th="' + k + '"><div class="pv" style="background:' + (s.mode === "light" ? t.light : t.dark) + '"><i style="background:' + t.accent + '"></i></div><b>' + t.name + "</b></button>"; }).join("") +
    '<button class="sw ' + (s.theme === "custom" ? "on" : "") + '" data-th="custom"><div class="pv" style="background:' + s.bg + '"><i style="background:' + s.accent + '"></i></div><b>Custom</b></button></div>' +
    '<div class="card" style="margin-top:14px"><div class="setRow"><div><b>Mode</b><div class="muted small">Dark or light</div></div><div class="seg"><button data-md="dark" class="' + (s.mode === "dark" ? "on" : "") + '">Dark</button><button data-md="light" class="' + (s.mode === "light" ? "on" : "") + '">Light</button></div></div>' +
    '<div class="setRow"><div><b>Custom background colour</b><div class="muted small">Used when theme is Custom</div></div><input type="color" id="cBg" value="' + s.bg + '"></div>' +
    '<div class="setRow"><div><b>Custom main accent colour</b><div class="muted small">Buttons, highlights, bars</div></div><input type="color" id="cAc" value="' + s.accent + '"></div>' +
    '<div class="setRow"><div><b>Sound effects</b><div class="muted small">Taps and domino falls</div></div><button class="toggle ' + (s.sound ? "on" : "") + '" id="tSnd"></button></div></div>' +
    '<h2>Backup</h2><div class="card"><div class="setRow"><div><b>Back up now</b><div class="muted small">Saves notes, stars, folders and risk spots as a file. Reminder every Sunday 2:00 PM.<br>Last backup: ' + (ST.lastBackup ? fmtTime(ST.lastBackup) : "never") + '</div></div><button class="btn acc" id="bkNow">' + icon("down") + 'Back up</button></div>' +
    '<div class="setRow"><div><b>Restore from backup</b><div class="muted small">Pick a backup file from Files</div></div><label class="btn">' + icon("up") + 'Restore<input type="file" id="bkFile" accept=".json,application/json" class="hide"></label></div></div>' +
    '<h2>Data updates</h2><div class="card"><div class="setRow"><div><b>Data version</b><div class="muted small">' + esc(window.SC_DATA_VERSION) + " · Monthly reminder to refresh numbers with Claude</div></div><span class=\"pill a\">" + Math.max(0, 30 - Math.floor((Date.now() - ST.lastUpdateAck) / 864e5)) + ' days left</span></div>' +
    '<div class="setRow"><div><b>Message for Claude</b><div class="muted small">' + esc(UPDATE_MSG) + '</div></div><button class="btn" id="cpMsg">' + icon("copy") + "Copy</button></div></div>" +
    '<h2>Reset</h2><div class="card"><div class="setRow"><div><b>Reset to default</b><div class="muted small">Theme, colours, sound and view go back to default. Your notes stay.</div></div><button class="btn" id="rsSet">Reset</button></div>' +
    '<div class="setRow"><div><b>Erase my data</b><div class="muted small">Deletes notes, stars, folders and risk spots</div></div><button class="btn red" id="rsAll">Erase</button></div></div>' +
    '<p class="muted small" style="margin:24px 0">Supply Chain · JSR Enterprises · Works offline. World map shapes are simplified. Numbers marked “approx” are estimates — tap any number to see its source. Not investment advice.</p>';
  var b = $("#settingsBody"); b.innerHTML = h;
  $$("[data-th]", b).forEach(function (x) { x.onclick = function () { s.theme = x.dataset.th; save(); applyTheme(); renderSettings(); }; });
  $$("[data-md]", b).forEach(function (x) { x.onclick = function () { s.mode = x.dataset.md; if (s.theme === "custom") s.theme = "midnight"; save(); applyTheme(); renderSettings(); }; });
  $("#cBg").oninput = function () { s.bg = this.value; s.theme = "custom"; save(); applyTheme(); }; $("#cBg").onchange = renderSettings;
  $("#cAc").oninput = function () { s.accent = this.value; s.theme = "custom"; save(); applyTheme(); }; $("#cAc").onchange = renderSettings;
  $("#tSnd").onclick = function () { s.sound = !s.sound; save(); renderSettings(); tapSound(); };
  $("#bkNow").onclick = backupNow;
  $("#bkFile").onchange = function () { var f = this.files[0]; if (!f) return; var r = new FileReader(); r.onload = function () { try { var d = JSON.parse(r.result); if (!d.stars) throw 0; var keepSet = ST.set; ST = d; ST.set = d.set || keepSet; save(); applyTheme(); renderSettings(); toast("Backup restored"); } catch (e) { toast("Not a valid backup file"); } }; r.readAsText(f); };
  $("#cpMsg").onclick = function () { copyText(UPDATE_MSG); };
  $("#rsSet").onclick = function () { ST.set = defaults().set; save(); applyTheme(); renderSettings(); toast("Settings reset"); };
  $("#rsAll").onclick = function () { openModal("Erase all my data?", '<p>This deletes all notes, stars, folders and risk spots. Make a backup first if you want to keep them.</p><div class="row"><button class="btn red" id="rsYes">Yes, erase</button><button class="btn" id="rsNo">Cancel</button></div>'); $("#rsNo").onclick = closeModal; $("#rsYes").onclick = function () { var keep = ST.set; ST = defaults(); ST.set = keep; save(); closeModal(); renderSettings(); toast("Data erased"); }; };
}
function backupNow() {
  ST.lastBackup = Date.now(); save();
  var d = new Date(), name = "supply-chain-backup-" + d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate() + ".json";
  shareOrDownload(new Blob([JSON.stringify(ST, null, 1)], { type: "application/json" }), name, "application/json");
  $("#banner").classList.add("hide");
  if (curTab === "settings") renderSettings();
}

/* ================= Reminders: weekly backup (Sun 2 PM) + monthly update ================= */
function lastSunday2pm() { var d = new Date(); d.setHours(14, 0, 0, 0); var diff = d.getDay(); d.setDate(d.getDate() - diff); if (d.getTime() > Date.now()) d.setDate(d.getDate() - 7); return d.getTime(); }
function checkReminders() {
  var bn = $("#banner"), ls = lastSunday2pm();
  if (ST.lastBackup < ls && ST.installed < ls && Date.now() > (ST.backupSnooze || 0)) {
    bn.innerHTML = '<div class="card row" style="justify-content:space-between;box-shadow:var(--shadow)"><div class="row">' + icon("down", ' width="22" height="22"') + '<div><b>Weekly backup</b><div class="muted small">Sunday 2:00 PM — save your notes & stars to Files</div></div></div><div class="row"><button class="btn acc" id="bnB">Back up now</button><button class="btn" id="bnL">Later</button></div></div>';
    bn.classList.remove("hide"); $("#bnB").onclick = backupNow; $("#bnL").onclick = function () { ST.backupSnooze = Date.now() + 3 * 3600e3; save(); bn.classList.add("hide"); };
  } else if (Date.now() - ST.lastUpdateAck > 30 * 864e5) {
    bn.innerHTML = '<div class="card row" style="justify-content:space-between;box-shadow:var(--shadow)"><div class="row">' + icon("info", ' width="22" height="22"') + '<div><b>Monthly update</b><div class="muted small">Time to refresh market cap & revenue numbers with Claude</div></div></div><div class="row"><button class="btn acc" id="bnC">Copy message</button><button class="btn" id="bnD">Done</button></div></div>';
    bn.classList.remove("hide"); $("#bnC").onclick = function () { copyText(UPDATE_MSG); }; $("#bnD").onclick = function () { ST.lastUpdateAck = Date.now(); save(); bn.classList.add("hide"); };
  } else bn.classList.add("hide");
}
checkReminders(); setInterval(checkReminders, 10 * 60e3);

/* ================= Start ================= */
function route() {
  var h = location.hash.replace(/^#/, ""), q = {}; h.split("&").forEach(function (p) { var kv = p.split("="); q[kv[0]] = decodeURIComponent(kv[1] || ""); });
  if (q.chain && D[q.chain]) { openChain(q.chain, q.node || null); return; }
  if (h === "chains" || h === "saved" || h === "settings") { showTab(h); return; }
  showTab("world");
}
route();
if ("serviceWorker" in navigator && location.protocol === "https:") { try { navigator.serviceWorker.register("sw.js"); } catch (e) {} }
})();
</script>
</body>
</html>
